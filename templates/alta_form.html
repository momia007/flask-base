{% extends "layout.html" %}

{% block title %}Alta de Alumno{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-primary">Alta de Alumno</h2>
    <form method="POST" action="{{ url_for('altas_bajas_modificaciones_alumnos.alta') }}" class="mt-4">
        <div class="form-group">
            <label>DNI</label>
            <input type="text" name="dni" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Apellido</label>
            <input type="text" name="apellido" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" name="nombre" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Curso</label>
            <select name="curso" class="form-control" required>
                {% for curso in cursos %}
                    <option value="{{ curso.id }}">{{ curso.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Cuatrimestre</label>
            <select name="cuatrimestre" class="form-control" required>
                <option value="0">Anual</option>
                <option value="1">Cuatrimestre 1</option>
                <option value="2">Cuatrimestre 2</option>
            </select>
        </div>
        <div class="form-group">
            <label>Año</label>
            <input type="text" name="anio" class="form-control" value="2026" required>
        </div>
        <button type="submit" class="btn btn-success mt-3">Guardar</button>
    </form>
</div>
{% endblock %}

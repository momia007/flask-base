<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cursos del Turno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Estilos para lista de cursos */
        .curso-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 1.2rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease;
            color: #0d3b66; /* azul oscuro para contraste */
            text-decoration: none;
        }
        .curso-item:hover {
            transform: scale(1.03);
        }
        /* Colores intercalados */
        .curso-item:nth-child(odd) {
            background-color: #8ec3fc; /* celeste claro */
        }
        .curso-item:nth-child(even) {
            background-color: #51a7fd; /* celeste más oscuro */
        }

        /* Barra superior con iconos */
        .top-bar {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar a {
            font-size: 1.5rem;
            color: #0d3b66;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- Barra superior -->
    <div class="top-bar">
        <!-- Icono Home -->
        <a href="{{ url_for('index') }}">🏠</a>
        <!-- Switch modo oscuro -->
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="darkSwitch">
            <label class="form-check-label ms-2" for="darkSwitch">🌙</label>
        </div>
    </div>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Cursos del Turno {{ turno }}</h2>

        <!-- Lista de cursos -->
        <div>
            <a href="{{ url_for('asistencia.asistencia', curso='1A') }}" class="curso-item d-block">1º A</a>
            <a href="{{ url_for('asistencia.asistencia', curso='1B') }}" class="curso-item d-block">1º B</a>
            <a href="{{ url_for('asistencia.asistencia', curso='2A') }}" class="curso-item d-block">2º A</a>
            <a href="{{ url_for('asistencia.asistencia', curso='2B') }}" class="curso-item d-block">2º B</a>
            <a href="{{ url_for('asistencia.asistencia', curso='3A') }}" class="curso-item d-block">3º A</a>
        </div>
    </div>

    <script>
        const darkSwitch = document.getElementById('darkSwitch');
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
            darkSwitch.checked = true;
        }
        darkSwitch.addEventListener('change', () => {
            if (darkSwitch.checked) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('darkMode', 'enabled');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('darkMode', 'disabled');
            }
        });
    </script>
</body>
</html>

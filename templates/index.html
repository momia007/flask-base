<!-- templates\index.html -->

{% extends "layout.html" %}

{% block title %}Panel de Asistencia Escolar{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-primary text-center mb-4">Panel de Asistencia Escolar</h2>

    <div class="d-flex flex-column align-items-center gap-3">

        <!-- Botón principal: asistencia -->
        <a href="{{ url_for('turnos.turnos') }}"
           class="main-btn"
           style="width: 100%; max-width: 500px;">
            Tomar asistencia
        </a>

        <!-- Botón adicional: consultas y justificaciones -->
        <a href="{{ url_for('visualizacion.index') }}"
           class="main-btn"
           style="width: 100%; max-width: 500px; background-color:#ddda2e; color:black;">
            Consultas / Justificaciones
        </a>

        <!-- Botón adicional: días especiales -->
        <a href="{{ url_for('dias_especiales.index') }}"
           class="main-btn"
           style="width: 100%; max-width: 500px; background-color:#4caf50; color:white;">
            Registrar días especiales
        </a>

    </div>
</div>
{% endblock %}

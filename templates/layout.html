<!-- templates\layout.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %} · {{ app_nombre }}</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <!-- Barra superior -->
    <div class="top-bar">
        <!-- Bloque izquierdo: ícono home + nombre de la app -->
        <div class="d-flex align-items-center gap-3">
            <a href="{{ url_for('index') }}" class="top-bar-home" title="Inicio">🏠</a>
            <span class="top-bar-info">{{ app_nombre }}</span>
        </div>

        <!-- Bloque derecho: versión, switch de modo oscuro, configuración -->
        <div class="d-flex align-items-center gap-3">
            <span class="top-bar-version" title="Versión de la aplicación">v{{ app_version }}</span>
            <div class="form-check form-switch m-0">
                <input class="form-check-input" type="checkbox" id="darkSwitch">
                <label class="form-check-label ms-2" for="darkSwitch">🌙</label>
            </div>
            <a href="{{ url_for('configuracion.index') }}"
               class="top-bar-config"
               title="Configuración">⚙️</a>
        </div>
    </div>

    <!-- Mensajes flash -->
    <div class="container mt-3">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
    </div>

    {% block content %}{% endblock %}

    <!-- Script modo oscuro -->
    <script>
        const darkSwitch = document.getElementById('darkSwitch');
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
            darkSwitch.checked = true;
        }
        darkSwitch.addEventListener('change', () => {
            if (darkSwitch.checked) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('darkMode', 'enabled');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('darkMode', 'disabled');
            }
        });
    </script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Flatpickr -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
</body>
</html>

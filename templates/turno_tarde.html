<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cursos Turno Tarde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Home arriba izquierda -->
    <div class="home-icon">
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">🏠</a>
    </div>

    <!-- Switch modo oscuro arriba derecha -->
    <div class="form-check form-switch dark-switch">
        <input class="form-check-input" type="checkbox" id="darkSwitch">
        <label class="form-check-label ms-2" for="darkSwitch">🌙</label>
    </div>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Cursos - Turno Tarde</h2>

        <div class="row">
            {% for curso in cursos %}
                <div class="col-md-4 mb-3">
                    <div class="card text-center 
                        {% if curso.id|string in cursos_con_asistencia %}
                            bg-success text-white
                        {% else %}
                            bg-dark text-light
                        {% endif %}">
                        
                        <div class="card-body">
                            <h5 class="card-title">{{ curso.nick }}</h5>
                            <p class="card-text">
                                Profesor: {{ curso.profesor }} <br>
                                Horario: {{ curso.inicio }} - {{ curso.fin }}
                            </p>
                            <a href="{{ url_for('asistencia.asistencia', curso=curso.id) }}" class="btn btn-light">
                                Ver asistencia
                            </a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>

        <!-- Botón volver -->
        <div class="text-center mt-4">
            <a href="{{ url_for('turnos.turnos') }}" class="btn btn-secondary">⬅️ Volver</a>
        </div>

        <!-- Link discreto para carga atrasada -->
        <div class="text-center mt-4">
            <a href="{{ url_for('turnos.turno_atrasada', turno='T') }}" class="text-muted small">
                ¿Necesitás cargar o revisar la asistencia atrasada de algún curso de este turno?
            </a>
        </div>
    </div>

    <script>
        const darkSwitch = document.getElementById('darkSwitch');

        // Al cargar la página, aplicar preferencia guardada
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
            darkSwitch.checked = true;
        } else {
            document.body.classList.remove('dark-mode');
            darkSwitch.checked = false;
        }

        // Al cambiar el switch, guardar preferencia
        darkSwitch.addEventListener('change', () => {
            if (darkSwitch.checked) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('darkMode', 'enabled');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('darkMode', 'disabled');
            }
        });
    </script>

</body>
</html>

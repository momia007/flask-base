<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selección de Turnos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Fondo y texto general */
        body.dark-mode {
            background-color: #121212;
            color: #f1f1f1;
        }

        /* Título */
        body.dark-mode h2 {
            color: #f1f1f1;
        }

        /* Botones en modo oscuro */
        body.dark-mode .btn {
            border: none;
        }
        body.dark-mode .btn-primary {
            background-color: #375a7f;
        }
        body.dark-mode .btn-success {
            background-color: #00bc8c;
        }
        body.dark-mode .btn-warning {
            background-color: #f39c12;
            color: #000;
        }
        body.dark-mode .btn-outline-secondary {
            border-color: #f1f1f1;
            color: #f1f1f1;
        }

        /* Switch en esquina superior derecha */
        .dark-switch {
            position: absolute;
            top: 15px;
            right: 20px;
        }
    </style>
</head>
<body>
    <!-- Switch modo oscuro -->
    <div class="form-check form-switch dark-switch">
        <input class="form-check-input" type="checkbox" id="darkSwitch">
        <label class="form-check-label ms-2" for="darkSwitch">🌙</label>
    </div>

    <div class="container text-center mt-5">
        <h2 class="mb-4 text-primary">Selecciona un turno</h2>

        <a href="{{ url_for('turnos.turno_manana') }}" class="btn btn-primary btn-lg d-block mb-3">Turno Mañana</a>
        <a href="{{ url_for('turnos.turno_tarde') }}" class="btn btn-success btn-lg d-block mb-3">Turno Tarde</a>
        <a href="{{ url_for('turnos.turno_vespertino') }}" class="btn btn-warning btn-lg d-block mb-3">Turno Vespertino</a>
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-lg d-block mt-4">Volver al inicio</a>
    </div>

    <script>
        const darkSwitch = document.getElementById('darkSwitch');

        // Al cargar la página, aplicar preferencia guardada
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
            darkSwitch.checked = true;
        }

        // Al cambiar el switch, guardar preferencia
        darkSwitch.addEventListener('change', () => {
            if (darkSwitch.checked) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('darkMode', 'enabled');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('darkMode', 'disabled');
            }
        });
    </script>
</body>
</html>
